name: studio_localhost
description: "Localhost Recording Studio: local music generation on your own hardware."
publish_to: 'none'
# One version for every platform (Android versionName/versionCode, macOS, Linux).
version: 0.3.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  provider: ^6.1.5+1
  file_selector: ^1.1.0
  crypto: ^3.0.7
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon-macos-1024.png
    - assets/icon-512.png
    - assets/models/registry.json
    - sidecar/pyproject.toml
    - sidecar/uv.lock
    - sidecar/studio_engine/
    - sidecar/studio_engine/yue2/
