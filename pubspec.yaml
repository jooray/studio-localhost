name: studio_localhost
description: "Localhost Recording Studio: local music generation on your own hardware."
publish_to: 'none'
# One version for every platform (Android versionName/versionCode, macOS, Linux).
version: 0.4.5+9

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  provider: ^6.1.5+1
  file_selector: ^1.1.0
  crypto: ^3.0.7
  path: ^1.9.1
  media_kit_libs_macos_audio: ^1.1.4
  media_kit_libs_linux: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon-master-1024.png
    - assets/brand/icon-macos-1024.png
    - assets/models/registry.json
    - sidecar/pyproject.toml
    - sidecar/uv.lock
    - sidecar/studio_engine/
    - sidecar/studio_engine/yue2/
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Light.ttf
          weight: 300
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
