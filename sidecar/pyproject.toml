[project]
name = "yue2-studio-sidecar"
version = "0.1.0"
description = "YuE2 Studio engine sidecar: JSON-lines stdio server with pluggable backends (mlx, yue2cpp, torch)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.scripts]
yue2-sidecar = "yue2_sidecar.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yue2_sidecar"]
