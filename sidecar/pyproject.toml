[project]
name = "studio-engine"
version = "0.3.0"
description = "Localhost Recording Studio engine sidecar: JSON-lines stdio server with pluggable model backends"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.scripts]
studio-engine = "studio_engine.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio_engine"]
